name: Bug report
description: Something did not install, or installed but does not work in the game.
labels: [bug]
body:
  - type: input
    id: game
    attributes:
      label: Game and launcher
      placeholder: "Metro 2033 Redux (Steam)"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: "RTX 4080, driver 616.92"
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Output of Verify
      description: Press **Verify** in the tool (or run `DLSS5Tool --verify "<path to game.exe>"`) after launching the game once, and paste the result.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach `dlss5-feed.log` and `ReShade.log` from the game folder (plus `host64\dlss5-feed-host.log` for a 32-bit game) and `%LOCALAPPDATA%\DLSS5Tool\logs\DLSS5Tool.log`.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
